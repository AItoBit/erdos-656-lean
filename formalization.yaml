    authors: ["Bryna Kra", "Joel Moreira", "Florian K. Richter", "Donald Robertson"]
    id: "doi:10.1090/cams/34"
    type: "article"
    location: "https://doi.org/10.1090/cams/34"
    relationship: "formalizes"
    note: "The ordinary-upper-density instance of Theorem 1.2(i), exactly Problem 656. The full upper-Banach-density theorem and part (ii) are outside this package's claim."
    license: "CC-BY-3.0"
    author_endorsement: "not-contacted"
  - title: "Erdős Problem 656"
    authors: ["Thomas F. Bloom"]
