version: "v0.4"
project:
  name: "Erdős Problem 656: translated restricted pair sums"
  description: >-
    A reproduction of a complete Lean proof that every set A of natural
    numbers with positive ordinary upper asymptotic density contains an
    infinite subset B whose distinct pair sums, after one integer translation,
    all lie in A. This is the exact ordinary-density statement of Erdős
    Problem 656, an instance of Kra–Moreira–Richter–Robertson Theorem 1.2(i).
  authors:
    - name: "AItoBit"
      github: "AItoBit"
  license: "Apache-2.0"
  responsible_maintainers:
    - name: "AItoBit"
      github: "AItoBit"
classification:
  arxiv: ["math.DS", "math.CO"]
  msc2020: ["37A44", "11B13", "68V15"]
